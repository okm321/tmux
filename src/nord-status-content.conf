#+----------------+
#+ Plugin Support +
#+----------------+
#+--- tmux-prefix-highlight ---+
set -g @prefix_highlight_output_prefix "#[fg=brightcyan]#[bg=black]#[nobold]#[noitalics]#[nounderscore]#[bg=brightcyan]#[fg=black]"
set -g @prefix_highlight_output_suffix ""
set -g @prefix_highlight_copy_mode_attr "fg=brightcyan,bg=black,bold"
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_prefix_prompt 'PREFIX'

#+--------+
#+ Status +
#+--------+
#+--- Bars ---+
set -g status-style bg=default
set -g status-left "#{?client_prefix,#[fg=black]#[bg=yellow]#[bold],#[fg=black]#[bg=blue]#[bold]} #S #{?client_prefix,#[fg=yellow]#[bg=black]#[nobold]#[noitalics]#[nounderscore],#[fg=blue]#[bg=default]#[nobold]#[noitalics]#[nounderscore]}"
set -g status-left-length 100
set -g status-right-length 100
set -g status-right '#{prefix_highlight}#[fg=brightblack,bg=default]#[fg=white,bg=brightblack] #(gitmux -cfg $HOME/.gitmux.conf "#{pane_current_path}")#[bg=brightblack] #[fg=brightblack,bg=default] #[fg=brightblack,bg=default]#[fg=white,bg=brightblack] #{pomodoro_status} #[fg=brightblack,bg=default]'

#+--- Windows ---+
set -g window-status-format "#[fg=#2E3440,bg=brightblack,nobold,noitalics,nounderscore] #[fg=white,bg=brightblack]#I #[fg=brightblack,bg=default,nobold,noitalics,nounderscore]"
set -g window-status-current-format "#[fg=#2E3440,bg=cyan,nobold,noitalics,nounderscore] #[fg=black,bg=cyan]#I #[fg=black,bg=cyan,nobold,noitalics,nounderscore]| #[fg=black,bg=cyan]#{?#{e|<:#{window_width},120},#{=8:window_name},#W} #[fg=cyan,bg=default,nobold,noitalics,nounderscore]"
set -g window-status-separator ""
